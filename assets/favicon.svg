<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Samkith K Jain">
  <defs>
    <!-- Deep Bordeaux Gradient Base -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Bezel Edge -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Cyan Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </radialGradient>
  </defs>

  <!-- Bordeaux Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#bezelGrad)" stroke-width="1.5"/>

  <!-- Subtly Inscribed Metric Coordinate Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Cardinal Axes -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>

  <!-- Radiant 4-Point Mathematical Star (Astroid) -->
  <path d="M32 9
           C32 21.5 21.5 32 9 32
           C21.5 32 32 42.5 32 55
           C32 42.5 42.5 32 55 32
           C42.5 32 32 21.5 32 9 Z"
        fill="#ffffff"/>

  <!-- Diagonal Sub-Ray Diamond Points -->
  <polygon points="32,23 35,32 32,41 29,32" fill="#fdfaf7" opacity="0.9"/>
  <polygon points="23,32 32,35 41,32 32,29" fill="#fdfaf7" opacity="0.9"/>

  <!-- Central Optical Core Lens -->
  <circle cx="32" cy="32" r="5" fill="url(#coreGlow)"/>
  <circle cx="32" cy="32" r="1.8" fill="#ffffff"/>

  <!-- 4 Corner Precision Calibrations -->
  <circle cx="16" cy="16" r="1.4" fill="rgba(255, 255, 255, 0.5)"/>
  <circle cx="48" cy="16" r="1.4" fill="rgba(255, 255, 255, 0.5)"/>
  <circle cx="16" cy="48" r="1.4" fill="rgba(255, 255, 255, 0.5)"/>
  <circle cx="48" cy="48" r="1.4" fill="rgba(255, 255, 255, 0.5)"/>
</svg>
